name: valixis_portal
description: VALIXIS Employee Portal — Internal Enterprise Application
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_riverpod: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # Typography
  google_fonts: ^6.2.1

  # Icons
  cupertino_icons: ^1.0.8

  # Supabase & Auth
  supabase_flutter: ^2.8.3
  flutter_dotenv: ^5.2.1

  # Utilities
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/logos/
    - assets/icons/
    - assets/images/
    - assets/animations/
