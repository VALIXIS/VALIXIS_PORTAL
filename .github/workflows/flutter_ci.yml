name: VALIXIS Portal CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  actions: write

jobs:
  flutter-ci-cd:
    name: Flutter Web Build, Test & Package
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java SDK (required for Android tooling & environment completeness)
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Install Flutter SDK (Stable release) & Cache Flutter Engine/Dependencies
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          cache-key: "flutter-:channel:-:version:-:arch:-:hash:"
          cache-path: "${{ runner.tool_cache }}/flutter"

      # Step 4: Cache Pub dependencies to accelerate build pipeline execution
      - name: Cache Pub Dependencies
        uses: actions/cache@v4
        with:
          path: ~/.pub-cache
          key: pub-cache-${{ runner.os }}-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            pub-cache-${{ runner.os }}-

      # Step 5: Install project dependencies
      - name: Install Pub Dependencies
        run: flutter pub get

      # Step 6: Verify static analysis (fails job if analyze finds errors)
      - name: Analyze Flutter Codebase
        run: flutter analyze --no-fatal-infos

      # Step 7: Execute unit and widget test suite (fails job if any test fails)
      - name: Run Unit & Widget Tests
        run: flutter test

      # Step 8: Build production web application bundle
      - name: Build Flutter Web Bundle
        run: flutter build web --release

      # Step 9: Upload build artifacts (build/web) for deployment
      - name: Upload Web Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: valixis-portal-web-build
          path: build/web
          retention-days: 14
          if-no-files-found: error
