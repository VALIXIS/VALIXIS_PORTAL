name: Deploy to Vercel

on:
  push:
    branches:
      - main
  workflow_run:
    workflows: ["VALIXIS Portal CI/CD"]
    branches:
      - main
    types:
      - completed

permissions:
  contents: read

jobs:
  deploy-to-vercel:
    name: Build & Deploy to Vercel Production
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'push' || (github.event.workflow_run != null && github.event.workflow_run.conclusion == 'success') }}

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      # Step 1: Checkout repository source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java SDK
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Step 3: Set up Flutter SDK (Stable release)
      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # Step 4: Install project dependencies
      - name: Install Pub Dependencies
        run: flutter pub get

      # Step 5: Build release web bundle
      - name: Build Flutter Web Release
        run: flutter build web --release

      # Step 6: Install Vercel CLI
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # Step 7: Link Vercel Project
      - name: Link Vercel Project
        run: |
          mkdir -p .vercel
          cat > .vercel/project.json <<EOF
          {
            "orgId": "${{ secrets.VERCEL_ORG_ID }}",
            "projectId": "${{ secrets.VERCEL_PROJECT_ID }}"
          }
          EOF

      # Step 8: Pull Vercel Environment Information
      - name: Pull Vercel Environment Information
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token=${{ secrets.VERCEL_TOKEN }} \
            --scope=${{ secrets.VERCEL_ORG_ID }}

      # Step 9: Build Vercel Deployment Artifacts
      - name: Build Vercel Project
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      # Step 10: Deploy Prebuilt Output to Vercel Production
      - name: Deploy Prebuilt Output to Vercel Production
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
